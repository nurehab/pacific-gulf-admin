<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0B2545">
<title>Pacific Gulf Admin</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%230B2545'/%3E%3Cpath d='M8 38c8-6 16-6 24 0s16 6 24 0' stroke='%230FA3A3' stroke-width='5' fill='none'/%3E%3Cpath d='M18 24a16 16 0 0 1 28 0' stroke='%23D4A537' stroke-width='4' fill='none'/%3E%3C/svg%3E">
<style>
/* =====================================================================
   PACIFIC GULF ADMIN — design tokens + shared components (same design
   system as the customer site) + admin layout. Navy + Teal + Gold.
   ===================================================================== */
:root{
  --navy:#0B2545; --navy-2:#13315C; --navy-3:#1E4976;
  --teal:#0FA3A3; --teal-2:#0B8586; --teal-soft:#E0F5F4;
  --gold:#D4A537; --gold-2:#A97F17; --gold-soft:#FBF3DE;
  --bg:#F4F7FA; --surface:#FFFFFF; --surface-2:#EEF3F7; --surface-3:#E3EAF1;
  --text:#0F1B2D; --muted:#56677C; --border:#DCE4EC;
  --danger:#C0352B; --danger-soft:#FDECEA; --success:#1B8553; --success-soft:#E5F5EC;
  --warning:#A86A12; --warning-soft:#FFF4DE; --info:#2459C9; --info-soft:#E8EFFD;
  --primary:var(--teal-2); --primary-hover:#096E6F; --on-primary:#fff;
  --shadow:0 1px 2px rgba(11,37,69,.06),0 6px 18px rgba(11,37,69,.07);
  --shadow-lg:0 18px 50px rgba(11,37,69,.22);
  --radius:16px; --radius-sm:10px; --radius-xs:7px;
  --font:"Segoe UI","Noto Sans Arabic","Noto Naskh Arabic","Noto Sans",Tahoma,system-ui,-apple-system,sans-serif;
  --focus:0 0 0 3px rgba(15,163,163,.45);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#07111F; --surface:#0E1C30; --surface-2:#14263D; --surface-3:#1B3150;
    --text:#E6EDF5; --muted:#97A9BE; --border:#22384F;
    --teal-soft:#0C3434; --gold-soft:#372C10; --danger-soft:#3A1614; --success-soft:#0E3222;
    --warning-soft:#382810; --info-soft:#12284B; --primary:#12B5B5; --primary-hover:#19C9C9; --on-primary:#04201F;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35); --shadow-lg:0 18px 50px rgba(0,0,0,.6);
    --danger:#F0776D; --success:#4CC98A; --warning:#E6A84A; --info:#7FA5F5; --gold-2:#E3B954;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#07111F; --surface:#0E1C30; --surface-2:#14263D; --surface-3:#1B3150;
  --text:#E6EDF5; --muted:#97A9BE; --border:#22384F;
  --teal-soft:#0C3434; --gold-soft:#372C10; --danger-soft:#3A1614; --success-soft:#0E3222;
  --warning-soft:#382810; --info-soft:#12284B; --primary:#12B5B5; --primary-hover:#19C9C9; --on-primary:#04201F;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35); --shadow-lg:0 18px 50px rgba(0,0,0,.6);
  --danger:#F0776D; --success:#4CC98A; --warning:#E6A84A; --info:#7FA5F5; --gold-2:#E3B954;
  color-scheme:dark;
}

/* ---------- Base ---------- */
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--font);font-size:15.5px;line-height:1.6;color:var(--text);background:var(--bg);min-height:100vh;display:flex;flex-direction:column}
main{flex:1;outline:none}
html,body{overflow-x:clip}
img,svg{max-width:100%}
a{color:var(--primary);text-decoration:none}
a:hover{text-decoration:underline}
h1,h2,h3,h4{line-height:1.25;margin:0 0 .5em;color:var(--text)}
h1{font-size:clamp(1.7rem,3.6vw,2.6rem)} h2{font-size:clamp(1.35rem,2.4vw,1.85rem)} h3{font-size:1.15rem} h4{font-size:1rem}
p{margin:0 0 1em}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:none;box-shadow:var(--focus);border-radius:6px}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.skip-link{position:fixed;max-width:calc(100vw - 24px);inset-inline-start:12px;top:-60px;z-index:999;background:var(--gold);color:var(--navy);padding:10px 16px;border-radius:8px;font-weight:700;border:0;cursor:pointer}
.skip-link:focus{top:10px}
.container{width:100%;max-width:1220px;margin:0 auto;padding:0 16px}
.muted{color:var(--muted)} .small{font-size:.86rem} .xsmall{font-size:.78rem} .bold{font-weight:700} .center{text-align:center}
.mt-0{margin-top:0}.mt-1{margin-top:8px}.mt-2{margin-top:16px}.mt-3{margin-top:24px}.mt-4{margin-top:40px}.mb-0{margin-bottom:0}.mb-1{margin-bottom:8px}.mb-2{margin-bottom:16px}.mb-3{margin-bottom:24px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.row-between{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.stack>*+*{margin-top:12px}
.grid{display:grid;gap:20px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:960px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:620px){.g2,.g3,.g4{grid-template-columns:1fr}}
.ic{width:1.15em;height:1.15em;vertical-align:-.2em;flex-shrink:0}
.ic-lg{width:28px;height:28px}.ic-xl{width:44px;height:44px}
[dir="rtl"] .flip-rtl{transform:scaleX(-1)}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 20px;border-radius:12px;border:1.5px solid transparent;font-weight:650;cursor:pointer;text-decoration:none!important;transition:background .15s,border-color .15s,transform .05s,box-shadow .15s;white-space:nowrap;line-height:1.2;font-size:.95rem}
.btn:active{transform:translateY(1px)}
.btn[disabled],.btn[aria-disabled="true"]{opacity:.55;cursor:not-allowed}
.btn-primary{background:var(--primary);color:var(--on-primary)}
.btn-primary:hover:not([disabled]){background:var(--primary-hover)}
.btn-gold{background:var(--gold);color:#1d1503}
.btn-gold:hover:not([disabled]){background:#E2B547}
.btn-navy{background:var(--navy);color:#fff}
.btn-navy:hover:not([disabled]){background:var(--navy-2)}
.btn-outline{background:transparent;border-color:var(--border);color:var(--text)}
.btn-outline:hover:not([disabled]){border-color:var(--primary);color:var(--primary)}
.btn-ghost{background:transparent;color:var(--primary);padding-inline:10px}
.btn-ghost:hover{background:var(--teal-soft)}
.btn-danger{background:var(--danger);color:#fff}
.btn-danger-outline{background:transparent;color:var(--danger);border-color:var(--danger)}
.btn-sm{padding:7px 13px;font-size:.86rem;border-radius:10px}
.btn-lg{padding:14px 26px;font-size:1.02rem}
.btn-block{width:100%}
.icon-btn{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:10px;border:1px solid var(--border);background:var(--surface);cursor:pointer;color:var(--text)}
.icon-btn:hover{border-color:var(--primary);color:var(--primary)}
.spinner{width:18px;height:18px;border:2.5px solid currentColor;border-inline-end-color:transparent;border-radius:50%;animation:spin .7s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- Forms ---------- */
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.field .label{font-size:.84rem;font-weight:650;color:var(--muted)}
.input,.select,.textarea{width:100%;padding:11px 13px;border-radius:var(--radius-sm);border:1.5px solid var(--border);background:var(--surface);color:var(--text);transition:border-color .15s,box-shadow .15s;min-height:44px}
.textarea{min-height:110px;resize:vertical}
.input:focus,.select:focus,.textarea:focus{border-color:var(--teal);box-shadow:var(--focus);outline:none}
.input[aria-invalid="true"],.select[aria-invalid="true"],.textarea[aria-invalid="true"]{border-color:var(--danger)}
.err{color:var(--danger);font-size:.8rem;min-height:0}
.err:empty{display:none}
.hint{font-size:.78rem;color:var(--muted)}
.form-grid{display:grid;gap:14px;grid-template-columns:repeat(2,minmax(0,1fr))}
.form-grid .full{grid-column:1/-1}
@media (max-width:620px){.form-grid{grid-template-columns:1fr}}
.check{display:flex;gap:10px;align-items:flex-start;cursor:pointer;font-size:.92rem}
.check input{width:18px;height:18px;margin-top:3px;accent-color:var(--teal-2);flex-shrink:0}
.ltr{direction:ltr;text-align:start}
[dir="rtl"] .ltr{text-align:right}
.counter{display:flex;align-items:center;gap:10px}
.counter button{width:32px;height:32px;border-radius:50%;border:1.5px solid var(--border);background:var(--surface);cursor:pointer;display:grid;place-items:center;color:var(--text)}
.counter button:hover:not([disabled]){border-color:var(--teal)}
.counter button[disabled]{opacity:.4;cursor:not-allowed}
.counter output{min-width:20px;text-align:center;font-weight:700}

/* ---------- Cards / badges ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-body{padding:20px}
.card-hover{transition:transform .2s,box-shadow .2s}
.card-hover:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:.76rem;font-weight:700;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.badge-teal{background:var(--teal-soft);color:var(--teal-2)}
:root[data-theme="dark"] .badge-teal{color:#5FE0DC}
.badge-gold{background:var(--gold-soft);color:var(--gold-2)}
.badge-navy{background:var(--navy);color:#fff}
.badge-success{background:var(--success-soft);color:var(--success)}
.badge-danger{background:var(--danger-soft);color:var(--danger)}
.badge-warning{background:var(--warning-soft);color:var(--warning)}
.badge-info{background:var(--info-soft);color:var(--info)}
.status-new{background:var(--info-soft);color:var(--info)}
.status-processing{background:var(--warning-soft);color:var(--warning)}
.status-completed{background:var(--success-soft);color:var(--success)}
.status-cancelled{background:var(--danger-soft);color:var(--danger)}
.stars{color:var(--gold);display:inline-flex;gap:1px}
.alert{display:flex;gap:12px;padding:14px 16px;border-radius:12px;border:1px solid var(--border);background:var(--surface-2);font-size:.92rem;align-items:flex-start}
.alert .ic{margin-top:3px}
.alert-info{background:var(--info-soft);border-color:transparent;color:var(--text)} .alert-info .ic{color:var(--info)}
.alert-warning{background:var(--warning-soft);border-color:transparent} .alert-warning .ic{color:var(--warning)}
.alert-danger{background:var(--danger-soft);border-color:transparent} .alert-danger .ic{color:var(--danger)}
.alert-success{background:var(--success-soft);border-color:transparent} .alert-success .ic{color:var(--success)}
.divider{height:1px;background:var(--border);margin:16px 0;border:0}
.kv{display:flex;justify-content:space-between;gap:12px;padding:6px 0;font-size:.93rem}
.kv span:first-child{color:var(--muted)}
.kv.total{font-weight:800;font-size:1.08rem;border-top:1px dashed var(--border);margin-top:6px;padding-top:12px}
.price{font-weight:800;color:var(--text);font-size:1.25rem;white-space:nowrap}
.price-sub{font-size:.78rem;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:999px;border:1.5px solid var(--border);background:var(--surface);cursor:pointer;font-size:.88rem;font-weight:600;color:var(--text)}
.chip[aria-pressed="true"],.chip.active{background:var(--navy);border-color:var(--navy);color:#fff}
:root[data-theme="dark"] .chip[aria-pressed="true"]{background:var(--teal-2);border-color:var(--teal-2)}
.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:12px}
table.table{width:100%;border-collapse:collapse;font-size:.92rem;background:var(--surface)}
.table th,.table td{padding:11px 14px;text-align:start;border-bottom:1px solid var(--border);vertical-align:top}
.table th{background:var(--surface-2);font-weight:700;font-size:.82rem;color:var(--muted);white-space:nowrap}
.table tr:last-child td{border-bottom:0}

/* ---------- Stepper / timeline ---------- */
.stepper{display:flex;gap:6px;list-style:none;padding:0;margin:0 0 22px;flex-wrap:wrap}
.stepper li{flex:1;min-width:110px;display:flex;align-items:center;gap:8px;font-size:.86rem;font-weight:650;color:var(--muted);padding:10px 12px;border-radius:12px;background:var(--surface-2)}
.stepper li .n{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--surface-3);font-size:.8rem;flex-shrink:0}
.stepper li.done{color:var(--success)} .stepper li.done .n{background:var(--success);color:#fff}
.stepper li.current{color:var(--text);background:var(--teal-soft)} .stepper li.current .n{background:var(--teal-2);color:#fff}
.timeline{list-style:none;padding:0;margin:0;position:relative}
.timeline li{position:relative;padding-inline-start:30px;padding-bottom:16px}
.timeline li::before{content:"";position:absolute;inset-inline-start:7px;top:18px;bottom:-2px;width:2px;background:var(--border)}
.timeline li:last-child::before{display:none}
.timeline .dot{position:absolute;inset-inline-start:0;top:4px;width:16px;height:16px;border-radius:50%;background:var(--teal-2);border:3px solid var(--teal-soft)}
.timeline li.pending .dot{background:var(--surface-3);border-color:var(--surface-2)}
.timeline li.pending{color:var(--muted)}
.timeline li.cancel .dot{background:var(--danger)}

/* ---------- Accordion ---------- */
.acc-item{border:1px solid var(--border);border-radius:14px;background:var(--surface);overflow:hidden}
.acc-item + .acc-item{margin-top:10px}
.acc-btn{width:100%;text-align:start;display:flex;justify-content:space-between;gap:12px;align-items:center;padding:16px 18px;background:transparent;border:0;cursor:pointer;font-weight:700;font-size:.98rem;color:var(--text)}
.acc-btn .ic{transition:transform .2s}
.acc-btn[aria-expanded="true"] .ic{transform:rotate(180deg)}
.acc-panel{padding:0 18px 16px;color:var(--muted)}
mark{background:var(--gold-soft);color:inherit;border-radius:3px;padding:0 2px}

/* ---------- Modal / toast ---------- */
.modal-backdrop{position:fixed;inset:0;background:rgba(4,12,24,.6);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px;animation:fade .15s}
.modal{background:var(--surface);border-radius:20px;box-shadow:var(--shadow-lg);width:100%;max-width:560px;max-height:calc(100vh - 32px);display:flex;flex-direction:column;animation:pop .18s;border:1px solid var(--border)}
.modal.lg{max-width:820px}.modal.sm{max-width:420px}
.modal-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--border)}
.modal-head h2{font-size:1.15rem;margin:0}
.modal-body{padding:20px;overflow:auto}
.modal-foot{display:flex;gap:10px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--border);flex-wrap:wrap}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{transform:translateY(10px) scale(.98);opacity:0}}
.toast-root{position:fixed;bottom:20px;left:0;right:0;margin:0 auto;z-index:300;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:calc(100% - 32px);max-width:460px}
.toast{background:var(--navy);color:#fff;padding:12px 16px;border-radius:12px;box-shadow:var(--shadow-lg);font-size:.92rem;display:flex;gap:10px;align-items:center;pointer-events:auto;animation:pop .2s;width:100%}
.toast.success{background:#11633F}.toast.error{background:#9B2A22}
.skeleton{background:linear-gradient(90deg,var(--surface-2) 25%,var(--surface-3) 50%,var(--surface-2) 75%);background-size:200% 100%;animation:shimmer 1.2s infinite;border-radius:12px}
@keyframes shimmer{to{background-position:-200% 0}}
.loading-block{display:flex;gap:12px;align-items:center;justify-content:center;padding:50px;color:var(--muted)}


/* =====================================================================
   ADMIN LAYOUT — sidebar + topbar + content
   ===================================================================== */
html,body{overflow-x:clip}
body.auth .shell{display:block}
body.auth .sidebar,body.auth .topbar{display:none}
.shell{display:grid;grid-template-columns:264px minmax(0,1fr);min-height:100vh}
.main-col{min-width:0;display:flex;flex-direction:column}
.content{padding:24px 22px 70px;width:100%;max-width:1440px}
.sidebar{background:#0A1F3B;color:#C3D2E3;position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;z-index:80}
.sb-brand{display:flex;gap:10px;align-items:center;padding:18px 18px 12px;color:#fff;text-decoration:none!important}
.sb-brand svg{width:40px;height:40px}
.sb-brand strong{display:block;font-size:1.05rem}
.sb-brand small{color:var(--gold);font-weight:700;font-size:.72rem;letter-spacing:.4px}
.sb-nav{padding:6px 10px 14px;flex:1}
.sb-group{font-size:.7rem;text-transform:uppercase;letter-spacing:.9px;color:#7891AE;padding:14px 12px 6px;font-weight:700}
.sb-link{display:flex;gap:11px;align-items:center;padding:9px 12px;border-radius:10px;color:#C3D2E3;font-weight:600;font-size:.9rem;text-decoration:none!important;border-inline-start:3px solid transparent;margin-bottom:2px}
.sb-link:hover{background:rgba(255,255,255,.06);color:#fff}
.sb-link.active{background:rgba(15,163,163,.18);color:#fff;border-inline-start-color:var(--gold)}
.sb-link .ic{width:19px;height:19px}
.sb-link .cnt{margin-inline-start:auto;background:var(--gold);color:#1d1503;border-radius:999px;font-size:.7rem;padding:1px 8px;font-weight:800}
.sb-foot{padding:14px 16px;border-top:1px solid rgba(255,255,255,.08);font-size:.78rem;color:#8EA5BF}
.sb-foot .who{color:#fff;font-weight:700;font-size:.86rem}
.topbar{position:sticky;top:0;z-index:40;min-height:64px;display:flex;align-items:center;gap:10px;padding:10px 22px;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--border)}
.tb-search{flex:1;max-width:480px;position:relative}
.tb-search .input{padding-inline-start:38px;min-height:40px}
.tb-search>.ic{position:absolute;inset-inline-start:12px;top:12px;color:var(--muted)}
.tb-spacer{flex:1}
.tb-btn{position:relative;height:40px;min-width:40px;padding:0 10px;border-radius:10px;border:1px solid var(--border);background:var(--surface);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:700;font-size:.85rem;color:var(--text)}
.tb-btn:hover{border-color:var(--primary);color:var(--primary)}
.tb-btn .dot{position:absolute;top:-5px;inset-inline-end:-5px;background:var(--danger);color:#fff;border-radius:999px;font-size:.66rem;min-width:18px;height:18px;display:grid;place-items:center;padding:0 4px}
.dd{position:relative}
.dd-menu{position:absolute;top:calc(100% + 8px);inset-inline-end:0;min-width:290px;max-width:min(380px,calc(100vw - 24px));background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow-lg);padding:8px;z-index:90;max-height:70vh;overflow:auto}
.dd-menu[hidden]{display:none}
.dd-item{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:start;padding:9px 10px;border-radius:9px;background:transparent;border:0;cursor:pointer;color:var(--text);font-size:.88rem;text-decoration:none!important}
.dd-item:hover,.dd-item:focus-visible{background:var(--surface-2)}
.dd-head{font-size:.72rem;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;padding:8px 10px 4px}
.dd-sep{height:1px;background:var(--border);margin:6px 0}
.search-pop{position:absolute;top:calc(100% + 6px);inset-inline:0;background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow-lg);padding:6px;z-index:90;max-height:60vh;overflow:auto}
.sb-toggle{display:none}
@media (max-width:1000px){
  .shell{grid-template-columns:1fr}
  .sidebar{position:fixed;inset-block:0;inset-inline-start:0;width:272px;transform:translateX(-105%);transition:transform .2s}
  [dir="rtl"] .sidebar{transform:translateX(105%)}
  .sidebar.open,[dir="rtl"] .sidebar.open{transform:none;box-shadow:var(--shadow-lg)}
  .sb-toggle{display:inline-flex}
  .content{padding:18px 14px 60px}
  .topbar{padding:10px 14px}
  .tb-hide-sm{display:none}
}
.imp-bar{position:sticky;top:0;z-index:70;background:var(--gold);color:#1d1503;font-weight:700;font-size:.88rem}
.imp-bar .inner{display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap;padding:8px 16px}
.imp-bar.preview{background:#7C4DFF;color:#fff}
.imp-bar .btn{padding:5px 12px;font-size:.8rem;background:#1d1503;color:#fff}

<script>
'use strict';
/* =====================================================================
   PACIFIC GULF ADMIN — RBAC-first back office prototype
   1) CONFIG & STATE
   ===================================================================== */
const CONFIG = {
  DEMO_MODE: true,
  STORAGE_KEY: 'pg_admin_store_v1',

const state = { lang: 'ar', theme: null, ui: {}, chatOpen: false };
/** Session: who is logged in, who we're acting as (impersonation), and an unsaved role being previewed. */
const session = { userId: null, actingUserId: null, previewRole: null, previewReturn: null };
function saveSession() { safeStorage.set(CONFIG.SESSION_KEY, JSON.stringify({ userId: session.userId, actingUserId: session.actingUserId, lang: state.lang, theme: state.theme })); }

  try {
    const s = JSON.parse(safeStorage.get(CONFIG.SESSION_KEY) || 'null');

}

/* =====================================================================
   2) PERMISSION MODEL — permission = module + action
   ===================================================================== */
const MODULES = ['dashboard', 'bookings', 'leads', 'visa_leads', 'customers', 'wallet', 'cms', 'packages', 'reports', 'users', 'roles', 'settings', 'api_keys', 'activity_log'];
const ACTIONS = ['view', 'create', 'edit', 'delete', 'export', 'change_status', 'add_note', 'refund', 'assign_lead', 'view_payment_details', 'view_api_keys'];
/** Which actions are meaningful for each module (other matrix cells are shown as "—"). */
const APPLICABLE = {
  dashboard: ['view', 'export'],
  bookings: ['view', 'create', 'edit', 'delete', 'export', 'change_status', 'add_note', 'refund', 'view_payment_details'],
  leads: ['view', 'create', 'edit', 'delete', 'export', 'change_status', 'add_note', 'assign_lead'],

  wallet: ['view', 'create', 'export', 'refund', 'view_payment_details'],
  cms: ['view', 'create', 'edit', 'delete'],
  packages: ['view', 'create', 'edit', 'delete', 'export'],
  reports: ['view', 'export'],
  users: ['view', 'create', 'edit', 'delete'],
  roles: ['view', 'create', 'edit', 'delete'],
  settings: ['view', 'edit'],
  api_keys: ['view', 'edit', 'view_api_keys'],
  activity_log: ['view', 'export']

const SERVICES = ['air', 'hotel', 'holiday', 'car', 'hajj', 'visa', 'investment'];
const STATUSES = ['new', 'processing', 'completed', 'cancelled'];
const LEAD_TYPES = ['hajj', 'visa_complex', 'contact'];
const LEAD_STATUSES = ['new', 'contacted', 'docs', 'done', 'rejected'];
const CURRENCIES = ['OMR', 'AED', 'SAR', 'USD'];
const DECIMALS = { OMR: 3, AED: 2, SAR: 2, USD: 2 };

const allPerms = () => Object.fromEntries(MODULES.map(m => [m, APPLICABLE[m].slice()]));

/* =====================================================================
   3) STORE (single source of truth; shared-contract shapes)
   ===================================================================== */
const store = { schema: 1, users: [], roles: [], bookings: [], leads: [], customers: [], wallets: [], packages: [], pages: [], settings: {}, activity: [], notifications: [] };
function persist() { safeStorage.set(CONFIG.STORAGE_KEY, JSON.stringify(store)); }
function loadStore() {
  const raw = safeStorage.get(CONFIG.STORAGE_KEY);

  seedStore(); persist();
}
const roleById = (id) => store.roles.find(r => r.id === id);
const userById = (id) => store.users.find(u => u.id === id);
const customerByEmail = (e) => store.customers.find(c => c.email === String(e || '').toLowerCase());
const walletOf = (userId) => store.wallets.find(w => w.userId === userId);
const rate = (cur) => (store.settings.currencies && store.settings.currencies[cur]) || 1;
const toOMR = (amount, cur) => round((+amount || 0) / rate(cur), 3);
function moneyIn(amount, cur) { try { return new Intl.NumberFormat(locale(), { style: 'currency', currency: cur, minimumFractionDigits: cur === 'OMR' ? 2 : 0, maximumFractionDigits: DECIMALS[cur] || 2 }).format(amount); } catch (e) { return amount + ' ' + cur; } }
const omr = (n) => moneyIn(round(n, 3), 'OMR');

const REF_CHARS = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';

/* ---------- Demo data (deterministic) ---------- */
const HOTEL_NAMES = [{ ar: 'منتجع رمال الحافة', en: 'Haffa Sands Resort' }, { ar: 'فندق لؤلؤة شاطئ القرم', en: 'Qurum Beach Pearl Hotel' }, { ar: 'برج أفق المارينا', en: 'Marina Horizon Tower' }, { ar: 'فندق تراس البوسفور', en: 'Bosphorus Terrace Hotel' }, { ar: 'فندق بانوراما النيل', en: 'Nile Panorama Hotel' }];
const CITIES = { MCT: { ar: 'مسقط', en: 'Muscat' }, SLL: { ar: 'صلالة', en: 'Salalah' }, DXB: { ar: 'دبي', en: 'Dubai' }, DOH: { ar: 'الدوحة', en: 'Doha' }, IST: { ar: 'إسطنبول', en: 'Istanbul' }, CAI: { ar: 'القاهرة', en: 'Cairo' }, LHR: { ar: 'لندن', en: 'London' }, BOM: { ar: 'مومباي', en: 'Mumbai' }, JED: { ar: 'جدة', en: 'Jeddah' } };
const AIRLINES = { WY: { ar: 'الطيران العُماني', en: 'Oman Air' }, OV: { ar: 'طيران السلام', en: 'SalamAir' }, EK: { ar: 'طيران الإمارات', en: 'Emirates' }, QR: { ar: 'الخطوط القطرية', en: 'Qatar Airways' }, TK: { ar: 'الخطوط التركية', en: 'Turkish Airlines' } };
const CUSTOMER_SEED = [
  ['Salim Al Balushi', 'salim@example.com', '+968 9123 4567', 'U-1001', ['VIP', 'Frequent']], ['Fatma Al Hinai', 'fatma.h@example.com', '+968 9234 1111', 'U-1002', ['Family']], ['Rashid Al Amri', 'rashid@example.com', '+968 9345 2222', 'U-1003', ['Visa']],

  const d = (n) => isoLocal(new Date(created.getTime() + n * 86400000));
  const cities = Object.keys(CITIES);
  if (service === 'air') { const from = 'MCT', to = cities[1 + Math.floor(r() * (cities.length - 1))]; const al = Object.keys(AIRLINES)[Math.floor(r() * 5)]; return { type: 'flight', pnr: Array.from({ length: 6 }, () => REF_CHARS[Math.floor(r() * 32)]).join(''), airline: al, airlineName: AIRLINES[al], trip: r() > 0.5 ? 'round' : 'oneway', cabin: r() > 0.85 ? 'business' : 'economy', from, to, date: d(10 + Math.floor(r() * 30)), pax: { adt: 1 + Math.floor(r() * 2), chd: Math.floor(r() * 2), inf: 0 } }; }
  if (service === 'hotel') { const h = HOTEL_NAMES[Math.floor(r() * HOTEL_NAMES.length)]; const ci = d(7 + Math.floor(r() * 20)); const n = 2 + Math.floor(r() * 4); return { type: 'hotel', hotelName: h, provider: r() > 0.5 ? 'TBO Holidays' : 'Hotelbeds', room: { ar: 'غرفة ديلوكس', en: 'Deluxe Room' }, meal: ['RO', 'BB', 'HB'][Math.floor(r() * 3)], checkIn: ci, checkOut: addDays(ci, n), nights: n, rooms: 1, supplierRef: 'TBO-' + Math.floor(10000000 + r() * 8e7) }; }

  if (service === 'car') { const m = ['Toyota Yaris', 'Nissan Patrol', 'Toyota Fortuner', 'Hyundai Elantra'][Math.floor(r() * 4)]; const p = d(5 + Math.floor(r() * 10)); return { type: 'car', model: m, pickup: 'MCT-APT', dropoff: 'MCT-APT', pickDate: p, pickTime: '10:00', dropDate: addDays(p, 3), dropTime: '10:00', days: 3, insurance: r() > 0.5 ? 'full' : 'basic', extras: r() > 0.6 ? ['gps'] : [] }; }
  if (service === 'visa') { const v = [{ c: { ar: 'الإمارات', en: 'United Arab Emirates' }, n: { ar: 'تأشيرة سياحية 30 يومًا', en: '30-day Tourist' } }, { c: { ar: 'تركيا', en: 'Türkiye' }, n: { ar: 'تأشيرة إلكترونية', en: 'e-Visa' } }, { c: { ar: 'مصر', en: 'Egypt' }, n: { ar: 'تأشيرة إلكترونية', en: 'e-Visa' } }][Math.floor(r() * 3)]; return { type: 'visa', country: v.c, visaName: v.n, travelDate: d(14 + Math.floor(r() * 20)), documents: [{ type: 'passport', name: 'passport.jpg' }, { type: 'photo', name: 'photo.jpg' }] }; }

   7) LAYOUT — sidebar (permission-filtered), topbar, impersonation bar
   ===================================================================== */
const NAV = [
  { g: 'g_main', items: [{ m: 'dashboard', href: '#/dashboard', ic: 'home' }] },
  { g: 'g_ops', items: [{ m: 'bookings', href: '#/bookings', ic: 'receipt' }, { m: 'leads', href: '#/leads', ic: 'users' }, { m: 'visa_leads', href: '#/visa-leads', ic: 'visa' }, { m: 'customers', href: '#/customers', ic: 'user' }, { m: 'wallet', href: '#/wallet', ic: 'wallet' }] },
  { g: 'g_content', items: [{ m: 'cms', href: '#/cms', ic: 'edit' }, { m: 'packages', href: '#/packages', ic: 'holiday' }] },
  { g: 'g_insights', items: [{ m: 'reports', href: '#/reports', ic: 'investment' }, { m: 'activity_log', href: '#/activity', ic: 'clock' }] },
  { g: 'g_admin', items: [{ m: 'users', href: '#/users', ic: 'users' }, { m: 'roles', href: '#/roles', ic: 'shield' }, { m: 'settings', href: '#/settings', ic: 'gear', alt: 'api_keys' }] }
];
/** Sidebar entry is visible only with `view` on its module (settings also opens for api_keys viewers). */
const navVisible = (it) => can(it.m, 'view') || (it.alt && can(it.alt, 'view'));
function firstAllowedRoute() { for (const g of NAV) for (const it of g.items) if (navVisible(it)) return it.href; return '#/me'; }
const isDark = () => state.theme ? state.theme === 'dark' : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
const avatarColor = (s) => ROLE_COLORS[[...String(s)].reduce((a, c) => a + c.charCodeAt(0), 0) % ROLE_COLORS.length];
const initials = (n) => String(n).split(' ').filter(Boolean).slice(0, 2).map(x => x[0]).join('').toUpperCase();
const roleBadge = (r) => r ? `<span class="role-badge"><span class="role-dot" style="background:${r.color}"></span>${esc(L(r.name))}</span>` : '';
const rolesOf = (u) => u.roleIds.map(roleById).filter(Boolean);

function renderSidebar() {
  const path = parseHash().path;
  const a = actor();
  const counts = { leads: store.leads.filter(l => l.status === 'new' && can('leads', 'view', l)).length, visa_leads: store.leads.filter(l => l.status === 'new' && can('visa_leads', 'view', l)).length, bookings: store.bookings.filter(b => b.status === 'new' && can('bookings', 'view', b)).length };
  $('#sidebar').innerHTML = `<a class="sb-brand" href="#/">${logoSVG()}<span><strong>Pacific Gulf</strong><small>ADMIN CONSOLE</small></span></a>
    <nav class="sb-nav" aria-label="${t('mainNav')}">
      ${NAV.map(g => { const vis = g.items.filter(navVisible); if (!vis.length) return ''; return `<div class="sb-group">${t(g.g)}</div>${vis.map(it => { const active = path.startsWith(it.href.slice(1)); return `<a class="sb-link ${active ? 'active' : ''}" href="${it.href}" ${active ? 'aria-current="page"' : ''}>${icon(it.ic)}<span>${t('m_' + it.m)}</span>${counts[it.m] ? `<span class="cnt" aria-label="${counts[it.m]} ${t('st_new')}">${counts[it.m]}</span>` : ''}</a>`; }).join('')}`; }).join('')}
      <div class="sb-group">${t('g_me')}</div><a class="sb-link ${path === '/me' ? 'active' : ''}" href="#/me">${icon('shield')}<span>${t('myPermissions')}</span></a>
    </nav>
    <div class="sb-foot">${a ? `<div class="who">${esc(a.name)}</div><div>${a.roles.map(r => esc(L(r.name))).join(' · ') || t('noRoles')}</div>` : ''}<div class="mt-1">v1.0 · ${t('prototype')}</div></div>`;
}

function renderImpBar() {
  const el = $('#imp-bar');
  if (session.previewRole) {
    el.className = 'imp-bar preview';
    el.innerHTML = `<div class="inner">${icon('eye')} <span>${t('previewingRole', { r: esc(L(session.previewRole.name) || t('newRole')) })}</span><button type="button" class="btn" id="end-preview">${icon('back', 'flip-rtl')} ${t('endPreview')}</button></div>`;
    $('#end-preview').onclick = endPreview;
  } else if (session.actingUserId && session.actingUserId !== session.userId) {
    const u = userById(session.actingUserId);
    el.className = 'imp-bar';
    el.innerHTML = `<div class="inner">${icon('user')} <span>${t('viewingAs', { n: esc(u ? u.name : '?'), r: u ? rolesOf(u).map(r => esc(L(r.name))).join(' + ') : '' })}</span><button type="button" class="btn" id="end-imp">${icon('back', 'flip-rtl')} ${t('backToMe')}</button></div>`;
    $('#end-imp').onclick = endImpersonation;
  } else { el.className = ''; el.innerHTML = ''; }
}

function renderTopbar() {
  const a = actor(), real = realUser();
  const notes = store.notifications.filter(n => can(n.module, 'view'));
  const unread = notes.filter(n => !n.read).length;
  const canImp = realCan('users', 'edit') && !session.previewRole;
  $('#topbar').innerHTML = `
    <button type="button" class="tb-btn sb-toggle" id="sb-toggle" aria-label="${t('menu')}" aria-controls="sidebar" aria-expanded="false">${icon('menu')}</button>
    <div class="tb-search" role="search"><label class="sr-only" for="g-search">${t('globalSearch')}</label>${icon('search')}<input id="g-search" class="input" type="search" autocomplete="off" placeholder="${t('globalSearchPh')}" aria-controls="g-results"><div id="g-results" class="search-pop" hidden></div></div>
    <span class="tb-spacer"></span>
    <div class="dd"><button type="button" class="tb-btn" id="notif-btn" aria-haspopup="true" aria-expanded="false" aria-label="${t('notifications')} (${unread})">${icon('info')}${unread ? `<span class="dot">${unread}</span>` : ''}</button>
      <div class="dd-menu" id="notif-menu" hidden role="menu"><div class="row-between"><div class="dd-head">${t('notifications')}</div>${unread ? `<button class="btn btn-ghost btn-sm" id="notif-read">${t('markAllRead')}</button>` : ''}</div>
        ${notes.length ? notes.slice(0, 10).map(n => `<a class="dd-item" href="${n.link}" role="menuitem">${n.read ? '' : '<span class="role-dot" style="background:var(--danger);margin-top:7px"></span>'}<span><span>${esc(L(n.text))}</span><br><span class="xsmall muted">${fmtDateTime(n.at)}</span></span></a>`).join('') : `<p class="small muted" style="padding:10px">${t('noNotifications')}</p>`}</div></div>

function parseHash() { const h = location.hash.replace(/^#/, '') || '/'; const [path, q] = h.split('?'); return { path: path || '/', query: Object.fromEntries(new URLSearchParams(q || '')) }; }
const ROUTES = [];
/** perm: [module, action] or a function returning boolean. */
const route = (pattern, handler, perm, title) => ROUTES.push({ re: new RegExp('^' + pattern.replace(/:(\w+)/g, '([^/]+)') + '$'), keys: (pattern.match(/:(\w+)/g) || []).map(k => k.slice(1)), handler, perm, title });
let routeToken = 0;
let pageActions = {};
const view = (html) => { $('#app').innerHTML = `<div class="content">${html}</div>`; };
async function router() {
  const token = ++routeToken;
  closeAllModals();
  const { path, query } = parseHash();
  if (!session.userId || !realUser()) { session.userId = null; renderChrome(); pageLogin(); document.title = t('login') + ' | Pacific Gulf Admin'; return; }
  if (path === '/' || path === '/login') { location.replace('#' + firstAllowedRoute().slice(1)); return; }
  renderChrome();
  const sb = $('#sidebar'); sb.classList.remove('open');
  pageActions = {};
  let match = null; const params = {};
  for (const r of ROUTES) { const m = path.match(r.re); if (m) { match = r; r.keys.forEach((k, i) => { params[k] = decodeURIComponent(m[i + 1]); }); break; } }
  if (!match) { view(`<div class="forbidden"><div class="code">404</div><p class="muted">${t('notFound')}</p><a class="btn btn-primary" href="${firstAllowedRoute()}">${t('goHome')}</a></div>`); return; }
  const allowed = typeof match.perm === 'function' ? match.perm(params) : (!match.perm || can(match.perm[0], match.perm[1]));
  document.title = `${t(match.title)} | Pacific Gulf Admin`;
  if (!allowed) { page403(Array.isArray(match.perm) ? match.perm : null); return; }
  const ctx = { params, query, path, stale: () => token !== routeToken };
  try { await match.handler(ctx); } catch (e) { if (!ctx.stale()) { console.warn(e); view(alertBox('danger', t('err_generic'))); } }
}

/** Export/view-type actions are allowed in preview mode (non-mutating). */
function guardView(m, a, r) { if (can(m, a, r)) return true; toast(denyReason(m, a, r), 'error'); return false; }

/* =====================================================================
   10) BOOKINGS — list (filters, pagination, CSV) + detail

function bookingsFiltered(ui) {
  return scopedBookings().filter(b => (!ui.service || b.service === ui.service) && (!ui.status || b.status === ui.status) && (!ui.from || isoLocal(new Date(b.createdAt)) >= ui.from) && (!ui.to || isoLocal(new Date(b.createdAt)) <= ui.to)
    && (!ui.q || (b.ref + ' ' + b.customer.name + ' ' + b.customer.email + ' ' + b.customer.phone).toLowerCase().includes(ui.q.toLowerCase())))
    .sort((a, b) => b.createdAt.localeCompare(a.createdAt));
}
function pageBookings(ctx) {
  const ui = state.ui.bk || (state.ui.bk = { q: '', service: ctx.query.service || '', status: '', from: '', to: '', page: 1 });
  const e = effective();
  const svcOptions = SERVICES.filter(s => e.services === 'all' || e.services.includes(s));
  const showPay = can('bookings', 'view_payment_details');
  view(`<div class="page-top"><div><h1>${t('m_bookings')}</h1><p>${t('bookingsSub')} ${e.services === 'all' ? '' : `· <span class="badge badge-info">${t('scopeLabel')}: ${e.services.map(s => t('svc_' + s)).join('، ')}</span>`}</p></div>
    <div class="toolbar">${gbtn({ m: 'bookings', a: 'create', label: t('importJson'), ic: 'upload', act: 'import' })}${gbtn({ m: 'bookings', a: 'export', label: t('exportCsv'), ic: 'download', act: 'export' })}</div></div>
    <section class="card"><form class="filters-row" id="bk-filters" role="search" aria-label="${t('filters')}">
      <div class="field" style="grid-column:span 2"><label for="bk-q">${t('searchBookings')}</label><input id="bk-q" name="q" class="input" type="search" value="${esc(ui.q)}" placeholder="${t('searchBookingsPh')}"></div>
      <div class="field"><label for="bk-svc">${t('service')}</label><select id="bk-svc" name="service" class="select"><option value="">${t('all')}</option>${svcOptions.map(s => `<option value="${s}" ${ui.service === s ? 'selected' : ''}>${t('svc_' + s)}</option>`).join('')}</select></div>
      <div class="field"><label for="bk-st">${t('status')}</label><select id="bk-st" name="status" class="select"><option value="">${t('all')}</option>${STATUSES.map(s => `<option value="${s}" ${ui.status === s ? 'selected' : ''}>${t('st_' + s)}</option>`).join('')}</select></div>
      <div class="field"><label for="bk-from">${t('fromDate')}</label><input id="bk-from" name="from" type="date" class="input" value="${ui.from}"></div>
      <div class="field"><label for="bk-to">${t('toDate')}</label><input id="bk-to" name="to" type="date" class="input" value="${ui.to}"></div>
    </form><div id="bk-table"></div></section>`);
  const draw = () => {
    const list = bookingsFiltered(ui); const pages = Math.max(1, Math.ceil(list.length / CONFIG.PAGE_SIZE)); ui.page = clamp(ui.page, 1, pages);
    const rows = list.slice((ui.page - 1) * CONFIG.PAGE_SIZE, ui.page * CONFIG.PAGE_SIZE);
    $('#bk-table').innerHTML = `<div class="table-wrap" style="border:0;border-top:1px solid var(--border);border-radius:0"><table class="table"><caption class="sr-only">${t('m_bookings')}</caption><thead><tr><th>${t('ref')}</th><th>${t('customer')}</th><th>${t('service')}</th><th>${t('details')}</th><th>${t('created')}</th><th>${t('amount')}</th><th>${t('payment')}</th><th>${t('status')}</th></tr></thead><tbody>
      ${rows.length ? rows.map(b => `<tr class="clickable" data-action="open" data-ref="${b.ref}" tabindex="0"><td class="mono">${b.ref}</td><td>${esc(b.customer.name)}<br><span class="xsmall muted">${esc(b.customer.email)}</span></td><td>${t('svc_' + b.service)}</td><td class="small">${esc(bookingTitle(b))}</td><td class="small">${fmtDate(b.createdAt)}</td><td><strong>${moneyIn(b.amount, b.currency)}</strong>${b.currency !== 'OMR' ? `<br><span class="xsmall muted">≈ ${omr(toOMR(b.amount, b.currency))}</span>` : ''}</td><td>${payBadge(b.payment.status)}${showPay ? `<br><span class="xsmall muted">${esc(b.payment.provider)}</span>` : ''}</td><td>${statusBadgeB(b.status)}</td></tr>`).join('') : `<tr><td colspan="8" class="center muted" style="padding:30px">${t('noData')}</td></tr>`}
      </tbody></table></div>${pager(list.length, ui.page, 'page')}`;
  };
  draw();
  const f = $('#bk-filters');
  f.addEventListener('input', () => { Object.assign(ui, formData(f)); ui.page = 1; draw(); });
  f.addEventListener('submit', (e2) => e2.preventDefault());
  $('#bk-table').addEventListener('keydown', (ev) => { const tr = ev.target.closest('tr[data-ref]'); if (tr && ev.key === 'Enter') go('#/bookings/' + tr.dataset.ref); });
  pageActions = {
    open: (el) => go('#/bookings/' + el.dataset.ref),
    page: (el) => { ui.page = +el.dataset.page; draw(); },
    export: () => {
      if (!guardView('bookings', 'export')) return;
      const list = bookingsFiltered(ui);
      downloadCSV(`bookings-${todayISO()}.csv`, [['ref', 'service', 'status', 'customer', 'email', 'phone', 'amount', 'currency', 'tax', 'payment_status', ...(showPay ? ['provider', 'txnId'] : []), 'createdAt'], ...list.map(b => [b.ref, b.service, b.status, b.customer.name, b.customer.email, b.customer.phone, b.amount, b.currency, b.tax, b.payment.status, ...(showPay ? [b.payment.provider, b.payment.txnId] : []), b.createdAt])]);
      logA('bookings', 'export', 'bookings', `Exported ${list.length} bookings to CSV`);
    },
    import: () => { if (guard('bookings', 'create')) importModal(); }
  };
}
/** Import from the customer site (exportState JSON). */
function importModal() {

    <label class="btn btn-outline btn-sm" for="imp-file" style="cursor:pointer">${icon('file')} ${t('chooseFile')}</label><input id="imp-file" type="file" accept="application/json,.json" class="sr-only">

      <label class="check"><input type="radio" name="method" value="original" ${w ? '' : 'checked'}> ${t('toOriginal')} (${esc(can('bookings', 'view_payment_details', b) ? b.payment.provider : '••••')})</label></fieldset>
    ${field({ name: 'reason', label: t('reason'), type: 'textarea', value: '' })}</form>`,

      <div class="stack">

          ${can('customers', 'edit') ? `<form id="tag-form" class="row mt-1"><label class="sr-only" for="tag-in">${t('addTag')}</label><input id="tag-in" class="input" style="flex:1;min-height:38px" placeholder="${t('addTag')}"><button class="btn btn-outline btn-sm" type="submit">${icon('plus')}</button></form>` : ''}</section>

          ${can('customers', 'add_note') ? `<form id="cn-form"><label class="sr-only" for="cn-ta">${t('addNote')}</label><textarea id="cn-ta" class="textarea" style="min-height:70px" placeholder="${t('notePh')}"></textarea><button class="btn btn-primary btn-sm mt-1" type="submit">${t('addNote')}</button></form>` : gbtn({ m: 'customers', a: 'add_note', label: t('addNote'), ic: 'plus', act: 'x' })}</section>

    edit: () => { if (guard('customers', 'edit')) customerForm(c); },

  };

/* =====================================================================
   13) WALLET — balances, transactions, manual credit, refunds
   ===================================================================== */
function pageWallet(ctx) {
  const ui = state.ui.wa || (state.ui.wa = { sel: ctx.query.u || '' });
  if (ctx.query.u) ui.sel = ctx.query.u;
  const custOf = (uidv) => store.customers.find(c => c.userId === uidv);
  const pending = store.bookings.filter(b => b.status === 'cancelled' && b.payment.status === 'paid' && can('bookings', 'view', b));
  const total = round(store.wallets.reduce((s, w) => s + w.balance, 0), 3);
  const sel = store.wallets.find(w => w.userId === ui.sel) || store.wallets[0];
  const payOK = can('wallet', 'view_payment_details');
  view(`<div class="page-top"><div><h1>${t('m_wallet')}</h1><p>${t('walletSub')}</p></div><div class="toolbar">${gbtn({ m: 'wallet', a: 'create', label: t('manualCredit'), ic: 'plus', act: 'credit', cls: 'btn-primary btn-sm' })}${gbtn({ m: 'wallet', a: 'refund', label: t('refundCancelled'), ic: 'refresh', act: 'refund' })}${gbtn({ m: 'wallet', a: 'export', label: t('exportCsv'), ic: 'download', act: 'export' })}</div></div>
    <div class="kpis kpis3 mb-2">
      <div class="card kpi"><div class="k-ic">${icon('wallet', 'ic-lg')}</div><div><div class="k-lbl">${t('totalBalances')}</div><div class="k-val">${omr(total)}</div></div></div>
      <div class="card kpi"><div class="k-ic gold">${icon('users', 'ic-lg')}</div><div><div class="k-lbl">${t('walletsCount')}</div><div class="k-val">${store.wallets.length}</div></div></div>
      <div class="card kpi"><div class="k-ic red">${icon('alert', 'ic-lg')}</div><div><div class="k-lbl">${t('pendingRefunds')}</div><div class="k-val">${pending.length}</div></div></div></div>
    <div class="grid split-r">
      <section class="card"><div class="card-body"><h2 class="mb-0" style="font-size:1.05rem">${t('balances')}</h2></div><div class="table-wrap" style="border:0;border-top:1px solid var(--border);border-radius:0"><table class="table"><thead><tr><th>${t('customer')}</th><th>${t('balance')}</th></tr></thead><tbody>
        ${store.wallets.map(w => { const c = custOf(w.userId); return `<tr class="clickable" data-action="sel" data-u="${w.userId}" tabindex="0" ${sel && sel.userId === w.userId ? 'style="background:var(--teal-soft)"' : ''}><td>${esc(c ? c.name : w.userId)}<br><span class="xsmall muted mono">${w.userId}</span></td><td class="bold">${omr(w.balance)}</td></tr>`; }).join('')}</tbody></table></div></section>
      <section class="card">${sel ? `<div class="card-body row-between"><div><h2 class="mb-0" style="font-size:1.05rem">${t('transactions')} — ${esc((custOf(sel.userId) || {}).name || sel.userId)}</h2><div class="small muted">${t('balance')}: <strong>${omr(sel.balance)}</strong></div></div></div>
        <div class="table-wrap" style="border:0;border-top:1px solid var(--border);border-radius:0"><table class="table"><thead><tr><th>${t('date')}</th><th>${t('type')}</th><th>${t('reference')}</th><th>${t('txId')}</th><th style="text-align:end">${t('amount')}</th></tr></thead><tbody>
        ${sel.transactions.map(x => `<tr><td class="small">${fmtDateTime(x.at)}</td><td><span class="badge ${x.type === 'payment' ? 'badge-danger' : x.type === 'refund' ? 'badge-info' : 'badge-success'}">${t('tx_' + x.type)}</span></td><td class="mono small">${esc(x.ref)}</td><td>${payOK ? `<span class="mono xsmall">${esc(x.id)}</span>` : masked('', false)}</td><td style="text-align:end;font-weight:700;color:${x.type === 'payment' ? 'var(--danger)' : 'var(--success)'}" dir="ltr">${x.type === 'payment' ? '−' : '+'}${omr(x.amount)}</td></tr>`).join('') || `<tr><td colspan="5" class="center muted">${t('noData')}</td></tr>`}</tbody></table></div>` : `<div class="card-body muted">${t('noData')}</div>`}</section></div>
    <section class="card mt-2"><div class="card-body"><h2 class="mb-0" style="font-size:1.05rem">${t('pendingRefunds')}</h2><p class="small muted mb-0">${t('pendingRefundsSub')}</p></div><div class="table-wrap" style="border:0;border-top:1px solid var(--border);border-radius:0"><table class="table"><thead><tr><th>${t('ref')}</th><th>${t('customer')}</th><th>${t('service')}</th><th>${t('amount')}</th><th></th></tr></thead><tbody>
      ${pending.map(b => `<tr><td class="mono">${b.ref}</td><td>${esc(b.customer.name)}</td><td>${t('svc_' + b.service)}</td><td>${moneyIn(b.amount, b.currency)}</td><td>${gbtn({ m: 'wallet', a: 'refund', res: b, label: t('refund'), ic: 'wallet', act: 'refundOne', data: `data-ref="${b.ref}"` })}</td></tr>`).join('') || `<tr><td colspan="5" class="center muted">${t('noPendingRefunds')}</td></tr>`}</tbody></table></div></section>`);
  pageActions = {
    sel: (el) => { ui.sel = el.dataset.u; rerender(); },
    credit: () => {
      if (!guard('wallet', 'create')) return;
      openModal({ title: t('manualCredit'), body: `<form id="mc" novalidate>${field({ name: 'userId', label: t('m_wallet'), type: 'select', options: store.wallets.map(w => [w.userId, `${(custOf(w.userId) || {}).name || w.userId} — ${omr(w.balance)}`]), value: sel ? sel.userId : '' })}<div class="form-grid mt-1">${field({ name: 'amount', label: t('amount') + ' (OMR)', type: 'number', required: true, attrs: 'min="1" max="5000" step="0.5"' })}${field({ name: 'reason', label: t('reason'), required: true })}</div></form>`,
        actions: [{ label: t('cancel') }, { label: t('addCredit'), cls: 'btn-primary', onClick: (close, btn, wrap) => {
          const f = $('#mc', wrap); const d = formData(f); const er = {}; const amt = +d.amount;
          if (!(amt >= 1 && amt <= 5000)) er.amount = t('err_amount'); if (!d.reason || d.reason.trim().length < 3) er.reason = t('err_required');
          if (!showErrors(f, er)) return;
          const w = walletOf(d.userId); const before = { balance: w.balance }; w.balance = round(w.balance + amt, 3);
          w.transactions.unshift({ id: uid('TX-'), type: 'topup', amount: round(amt, 3), ref: 'ADJ-' + yymmdd(new Date()) + ' ' + d.reason.trim().slice(0, 30), at: new Date().toISOString() });
          logA('wallet', 'create', w.userId, `Manual credit ${amt} OMR (${d.reason.trim()})`, before, { balance: w.balance });
          close(); ui.sel = w.userId; toast(t('saved'), 'success'); rerender();
        } }] });
    },
    refund: () => {
      if (!guard('wallet', 'refund')) return;
      if (!pending.length) { toast(t('noPendingRefunds')); return; }
      openModal({ title: t('refundCancelled'), size: 'sm', body: `<form id="pr">${field({ name: 'ref', label: t('cancelledBooking'), type: 'select', options: pending.map(b => [b.ref, `${b.ref} · ${b.customer.name} · ${moneyIn(b.amount, b.currency)}`]) })}</form>`,
        actions: [{ label: t('cancel') }, { label: t('continue'), cls: 'btn-primary', onClick: (close, btn, wrap) => { const ref = formData($('#pr', wrap)).ref; close(); walletRefund(ref); } }] });
    },
    refundOne: (el) => walletRefund(el.dataset.ref),
    export: () => { if (!guardView('wallet', 'export')) return; const rows = store.wallets.flatMap(w => w.transactions.map(x => [w.userId, (custOf(w.userId) || {}).name || '', x.id, x.type, x.amount, x.ref, x.at])); downloadCSV(`wallet-transactions-${todayISO()}.csv`, [['userId', 'customer', 'txId', 'type', 'amountOMR', 'ref', 'at'], ...rows]); logA('wallet', 'export', 'wallet', `Exported ${rows.length} wallet transactions`); }
  };
}
/** Wallet-module refund (Finance path): uses wallet.refund, independent of bookings.edit. */
function walletRefund(ref) {
  const b = store.bookings.find(x => x.ref === ref);
  if (!b || !guard('wallet', 'refund', b)) return;
  refundModal(b, () => rerender());
}

/* =====================================================================
   14) CMS — bilingual website pages
   ===================================================================== */
function pageCMS() {
  const ui = state.ui.cms || (state.ui.cms = { sel: store.pages[0] ? store.pages[0].id : null });
  const pg = store.pages.find(p => p.id === ui.sel) || store.pages[0];
  const ed = can('cms', 'edit');
  view(`<div class="page-top"><div><h1>${t('m_cms')}</h1><p>${t('cmsSub')}</p></div><div class="toolbar">${gbtn({ m: 'cms', a: 'create', label: t('newPage'), ic: 'plus', act: 'create', cls: 'btn-primary btn-sm' })}</div></div>
    <div class="grid split-nav">
      <nav class="card" aria-label="${t('pages')}" style="padding:8px">${store.pages.map(p => `<button type="button" class="dd-item ${p.id === pg.id ? 'bold' : ''}" data-action="sel" data-id="${p.id}" ${p.id === pg.id ? 'aria-current="true" style="background:var(--teal-soft)"' : ''}>${icon('file')}<span>${esc(L(p.title))}<br><span class="xsmall muted">${fmtDate(p.updatedAt)} · ${esc(p.updatedBy)}</span></span></button>`).join('')}</nav>
      ${pg ? `<section class="card card-body"><form id="cms-form" novalidate>
        <div class="row-between mb-2"><h2 class="mb-0" style="font-size:1.1rem">${esc(L(pg.title))} <span class="mono xsmall muted">/${pg.id}</span></h2>${ed ? '' : `<span class="badge badge-warning">${icon('lock')} ${t('readOnly')}</span>`}</div>
        <div class="grid g2"><div class="stack"><h3 style="font-size:.95rem">العربية</h3>${field({ name: 'title_ar', label: t('title'), value: pg.title.ar, attrs: `dir="rtl" ${ed ? '' : 'readonly'}` })}${field({ name: 'body_ar', label: t('body'), type: 'textarea', value: pg.body.ar, attrs: `dir="rtl" rows="8" ${ed ? '' : 'readonly'}` })}</div>
          <div class="stack"><h3 style="font-size:.95rem">English</h3>${field({ name: 'title_en', label: t('title'), value: pg.title.en, attrs: `dir="ltr" ${ed ? '' : 'readonly'}` })}${field({ name: 'body_en', label: t('body'), type: 'textarea', value: pg.body.en, attrs: `dir="ltr" rows="8" ${ed ? '' : 'readonly'}` })}</div></div>
        <div class="row mt-2">${gbtn({ m: 'cms', a: 'edit', label: t('saveChanges'), ic: 'check', act: 'save', cls: 'btn-primary' })}${gbtn({ m: 'cms', a: 'delete', label: t('delete'), ic: 'trash', act: 'delete', cls: 'btn-danger-outline btn-sm' })}</div></form>
        <hr class="divider"><h3 style="font-size:.95rem">${t('preview')}</h3><div class="grid g2"><div class="card card-body" dir="rtl"><h4>${esc(pg.title.ar)}</h4><p class="small mb-0">${esc(pg.body.ar)}</p></div><div class="card card-body" dir="ltr"><h4>${esc(pg.title.en)}</h4><p class="small mb-0">${esc(pg.body.en)}</p></div></div></section>` : ''}</div>`);
  pageActions = {
    sel: (el) => { ui.sel = el.dataset.id; rerender(); },
    save: () => {
      if (!guard('cms', 'edit')) return; const d = formData($('#cms-form'));
      if (!d.title_ar.trim() || !d.title_en.trim()) { toast(t('err_required'), 'error'); return; }
      const before = clone(pg); pg.title = { ar: d.title_ar.trim(), en: d.title_en.trim() }; pg.body = { ar: d.body_ar, en: d.body_en }; pg.updatedAt = new Date().toISOString(); pg.updatedBy = actor().name;
      logA('cms', 'edit', pg.id, `Edited page “${pg.title.en}”`, before, pg); toast(t('saved'), 'success'); rerender();
    },
    create: () => {
      if (!guard('cms', 'create')) return;
      openModal({ title: t('newPage'), size: 'sm', body: `<form id="np" novalidate>${field({ name: 'slug', label: t('slug'), required: true, ltr: true, placeholder: 'hajj-guide' })}${field({ name: 'en', label: t('title') + ' (EN)', required: true })}${field({ name: 'ar', label: t('title') + ' (AR)', required: true, attrs: 'dir="rtl"' })}</form>`,
        actions: [{ label: t('cancel') }, { label: t('create'), cls: 'btn-primary', onClick: (close, btn, wrap) => {
          const f = $('#np', wrap); const d = formData(f); const er = {};
          if (!/^[a-z0-9-]{3,40}$/.test(d.slug)) er.slug = t('err_slug'); else if (store.pages.some(p => p.id === d.slug)) er.slug = t('err_exists');
          if (!d.en.trim()) er.en = t('err_required'); if (!d.ar.trim()) er.ar = t('err_required');
          if (!showErrors(f, er)) return;
          const p = { id: d.slug, title: { ar: d.ar.trim(), en: d.en.trim() }, body: { ar: '', en: '' }, updatedAt: new Date().toISOString(), updatedBy: actor().name };
          store.pages.push(p); ui.sel = p.id; logA('cms', 'create', p.id, `Created page “${p.title.en}”`, null, p); close(); rerender();
        } }] });
    },
    delete: async () => { if (!guard('cms', 'delete')) return; if (await confirmModal({ title: t('delete'), body: `<p>${t('deletePageBody', { n: esc(L(pg.title)) })}</p>`, danger: true, confirmLabel: t('delete') })) { store.pages = store.pages.filter(p => p !== pg); ui.sel = store.pages[0] && store.pages[0].id; logA('cms', 'delete', pg.id, `Deleted page “${pg.title.en}”`, pg, null); rerender(); } }
  };
}

    <div class="row mb-2" role="group" aria-label="${t('type')}">${['', 'holiday', 'umrah', 'hajj'].map(x => `<button type="button" class="chip" data-action="type" data-type="${x}" aria-pressed="${ui.type === x}">${x ? t('pt_' + x) : t('all')} (${store.packages.filter(p => !x || p.type === x).length})</button>`).join('')}</div>

      <div class="row-between"><span class="badge badge-gold">${t('pt_' + p.type)}</span>${p.active ? `<span class="badge badge-success">${t('active')}</span>` : `<span class="badge">${t('inactive')}</span>`}</div>
      <h3 class="mt-1" style="font-size:1rem">${esc(L(p.title))}</h3><div class="small muted">${icon('pin')} ${esc(L(p.dest))} · ${p.nights} ${t('nights')} · ${p.itinerary.length} ${t('days')}</div>
      <div class="row-between mt-1"><strong>${omr(p.price)}</strong><span class="xsmall muted">${t('perPerson')}</span></div>
      <div class="row mt-1" style="gap:6px">${gbtn({ m: 'packages', a: 'edit', label: t('edit'), ic: 'edit', act: 'edit', data: `data-id="${p.id}"` })}${gbtn({ m: 'packages', a: 'delete', label: t('delete'), ic: 'trash', act: 'delete', data: `data-id="${p.id}"`, cls: 'btn-danger-outline btn-sm' })}</div></div></article>`).join('') || `<p class="muted">${t('noData')}</p>`}</div>`);

    export: () => { if (!guardView('packages', 'export')) return; downloadCSV(`packages-${todayISO()}.csv`, [['id', 'type', 'title_en', 'title_ar', 'dest_en', 'nights', 'priceOMR', 'active', 'days'], ...store.packages.map(p => [p.id, p.type, p.title.en, p.title.ar, p.dest.en, p.nights, p.price, p.active, p.itinerary.length])]); logA('packages', 'export', 'packages', 'Exported packages'); }

function packageForm(p) {
  const x = p ? clone(p) : { type: 'holiday', title: { ar: '', en: '' }, dest: { ar: '', en: '' }, nights: 3, price: 199, images: ['sea', 'city', 'green'], active: true, itinerary: [{ title: { ar: '', en: '' }, desc: { ar: '', en: '' } }] };
  const dayRow = (d, i) => `<div class="card card-body mb-1" data-day="${i}" style="padding:12px"><div class="row-between mb-1"><strong class="small">${t('day')} ${i + 1}</strong><button type="button" class="btn btn-ghost btn-sm" data-rmday="${i}" aria-label="${t('remove')} ${t('day')} ${i + 1}">${icon('trash')}</button></div><div class="form-grid">${field({ name: `d${i}_ten`, label: t('title') + ' (EN)', value: d.title.en })}${field({ name: `d${i}_tar`, label: t('title') + ' (AR)', value: d.title.ar, attrs: 'dir="rtl"' })}${field({ name: `d${i}_den`, label: t('desc') + ' (EN)', value: d.desc.en })}${field({ name: `d${i}_dar`, label: t('desc') + ' (AR)', value: d.desc.ar, attrs: 'dir="rtl"' })}</div></div>`;
  const body = () => `<form id="pkf" novalidate><div class="form-grid">
    ${field({ name: 'type', label: t('type'), type: 'select', options: [['holiday', t('pt_holiday')], ['umrah', t('pt_umrah')], ['hajj', t('pt_hajj')]], value: x.type })}
    <label class="switch" style="align-self:end"><input type="checkbox" name="active" value="1" ${x.active ? 'checked' : ''}> ${t('active')}</label>
    ${field({ name: 'ten', label: t('title') + ' (EN)', required: true, value: x.title.en })}${field({ name: 'tar', label: t('title') + ' (AR)', required: true, value: x.title.ar, attrs: 'dir="rtl"' })}
    ${field({ name: 'den', label: t('destination') + ' (EN)', required: true, value: x.dest.en })}${field({ name: 'dar', label: t('destination') + ' (AR)', required: true, value: x.dest.ar, attrs: 'dir="rtl"' })}
    ${field({ name: 'nights', label: t('nights'), type: 'number', required: true, value: x.nights, attrs: 'min="1" max="30"' })}${field({ name: 'price', label: t('pricePP') + ' (OMR)', type: 'number', required: true, value: x.price, attrs: 'min="1" step="0.5"' })}
  </div>
  <h3 class="mt-2" style="font-size:.95rem">${t('images')}</h3><p class="xsmall muted">${t('imagesHint')}</p>
  <div class="grid g3">${[0, 1, 2].map(i => `<div><div class="pkg-media" style="border-radius:10px" id="img-prev-${i}">${art(x.images[i] || 'sea', 'pk' + i)}</div>${field({ name: 'img' + i, label: t('image') + ' ' + (i + 1), type: 'select', options: ART_KINDS.map(k => [k, t('art_' + k)]), value: x.images[i] || 'sea' })}</div>`).join('')}</div>
  <div class="row-between mt-2"><h3 class="mb-0" style="font-size:.95rem">${t('itinerary')}</h3><button type="button" class="btn btn-outline btn-sm" id="add-day">${icon('plus')} ${t('addDay')}</button></div>
  <div id="days" class="mt-1">${x.itinerary.map(dayRow).join('')}</div></form>`;
  const collect = (wrap) => { const d = formData($('#pkf', wrap)); x.type = d.type; x.active = !!d.active; x.title = { en: d.ten || '', ar: d.tar || '' }; x.dest = { en: d.den || '', ar: d.dar || '' }; x.nights = +d.nights; x.price = +d.price; x.images = [d.img0, d.img1, d.img2]; x.itinerary = x.itinerary.map((_, i) => ({ title: { en: d[`d${i}_ten`] || '', ar: d[`d${i}_tar`] || '' }, desc: { en: d[`d${i}_den`] || '', ar: d[`d${i}_dar`] || '' } })); return d; };
  const bindInner = (wrap) => {
    $('#add-day', wrap).onclick = () => { collect(wrap); x.itinerary.push({ title: { ar: '', en: '' }, desc: { ar: '', en: '' } }); $('.modal-body', wrap).innerHTML = body(); bindInner(wrap); };
    $$('[data-rmday]', wrap).forEach(b => b.onclick = () => { collect(wrap); if (x.itinerary.length <= 1) { toast(t('err_oneDay'), 'error'); return; } x.itinerary.splice(+b.dataset.rmday, 1); $('.modal-body', wrap).innerHTML = body(); bindInner(wrap); });
    [0, 1, 2].forEach(i => { $(`[name="img${i}"]`, wrap).onchange = (e) => { $('#img-prev-' + i, wrap).innerHTML = art(e.target.value, 'pk' + i + e.target.value); }; });
  };
  openModal({ title: p ? t('editPackage') : t('newPackage'), size: 'lg', body: body(), onOpen: (wrap) => bindInner(wrap),
    actions: [{ label: t('cancel') }, { label: t('save'), cls: 'btn-primary', onClick: (close, btn, wrap) => {
      const d = collect(wrap); const f = $('#pkf', wrap); const er = {};
      ['ten', 'tar', 'den', 'dar'].forEach(k => { if (!String(d[k] || '').trim()) er[k] = t('err_required'); });
      if (!(x.nights >= 1 && x.nights <= 30)) er.nights = t('err_amount'); if (!(x.price > 0)) er.price = t('err_amount');
      if (x.itinerary.some(it => !it.title.en.trim() || !it.title.ar.trim())) { toast(t('err_dayTitles'), 'error'); if (!Object.keys(er).length) return; }
      if (!showErrors(f, er)) return;
      if (x.itinerary.some(it => !it.title.en.trim() || !it.title.ar.trim())) return;
      x.updatedAt = new Date().toISOString(); x.updatedBy = actor().name;
      if (p) { const before = clone(p); Object.assign(p, x); logA('packages', 'edit', p.id, `Edited package “${p.title.en}”`, before, p); }
      else { x.id = uid('PK-'); store.packages.unshift(x); logA('packages', 'create', x.id, `Created package “${x.title.en}”`, null, x); }
      close(); toast(t('saved'), 'success'); rerender();
    } }] });
}

/* =====================================================================
   16) REPORTS — sales & bookings by period and service
   ===================================================================== */
function pageReports() {
  const ui = state.ui.rp || (state.ui.rp = { from: addDays(todayISO(), -30), to: todayISO(), service: '' });
  const list = scopedBookings().filter(b => { const d = isoLocal(new Date(b.createdAt)); return d >= ui.from && d <= ui.to && (!ui.service || b.service === ui.service); });
  const days = Math.max(1, daysBetween(ui.from, ui.to) + 1);
  const step = days > 60 ? 7 : 1;
  const series = []; for (let i = 0; i < days; i += step) { const d0 = addDays(ui.from, i), d1 = addDays(ui.from, i + step - 1); series.push({ l: fmtDate(d0, { day: 'numeric', month: 'short' }), v: revenueOMR(list.filter(b => { const d = isoLocal(new Date(b.createdAt)); return d >= d0 && d <= d1; })) }); }
  const bySvc = SERVICES.map(s => { const l = list.filter(b => b.service === s); return { s, n: l.length, rev: revenueOMR(l), cancelled: l.filter(b => b.status === 'cancelled').length, tax: round(l.filter(b => b.status !== 'cancelled').reduce((a, b) => a + toOMR(b.tax, b.currency), 0), 3) }; }).filter(r => r.n);
  const tot = { n: list.length, rev: revenueOMR(list), tax: round(bySvc.reduce((a, r) => a + r.tax, 0), 3), cancelled: list.filter(b => b.status === 'cancelled').length };
  view(`<div class="page-top"><div><h1>${t('m_reports')}</h1><p>${t('reportsSub')}</p></div><div class="toolbar">${gbtn({ m: 'reports', a: 'export', label: t('exportCsv'), ic: 'download', act: 'export' })}<button type="button" class="btn btn-ghost btn-sm" onclick="window.print()">${icon('print')} ${t('print')}</button></div></div>
    <form class="card filters-row mb-2" id="rp-f"><div class="field"><label for="rp-from">${t('fromDate')}</label><input id="rp-from" name="from" type="date" class="input" value="${ui.from}"></div><div class="field"><label for="rp-to">${t('toDate')}</label><input id="rp-to" name="to" type="date" class="input" value="${ui.to}"></div>
      <div class="field"><label for="rp-svc">${t('service')}</label><select id="rp-svc" name="service" class="select"><option value="">${t('all')}</option>${SERVICES.map(s => `<option value="${s}" ${ui.service === s ? 'selected' : ''}>${t('svc_' + s)}</option>`).join('')}</select></div>
      <div class="field" style="grid-column:span 3;justify-content:flex-end"><div class="row">${[7, 30, 90].map(n => `<button type="button" class="chip" data-action="range" data-n="${n}">${t('lastNDays', { n })}</button>`).join('')}</div></div></form>
    <div class="kpis mb-2"><div class="card kpi"><div class="k-ic">${icon('receipt', 'ic-lg')}</div><div><div class="k-lbl">${t('bookingsWord')}</div><div class="k-val">${tot.n}</div></div></div><div class="card kpi"><div class="k-ic gold">${icon('investment', 'ic-lg')}</div><div><div class="k-lbl">${t('netSales')}</div><div class="k-val">${omr(tot.rev)}</div></div></div><div class="card kpi"><div class="k-ic navy">${icon('tag', 'ic-lg')}</div><div><div class="k-lbl">${t('vatCollected')}</div><div class="k-val">${omr(tot.tax)}</div></div></div><div class="card kpi"><div class="k-ic red">${icon('x', 'ic-lg')}</div><div><div class="k-lbl">${t('cancellations')}</div><div class="k-val">${tot.cancelled}</div></div></div></div>
    <section class="card card-body chart mb-2"><h2 style="font-size:1.05rem">${t('salesOverTime')}</h2>${barChartSVG(series, '#D4A537', omr)}</section>
    <section class="card"><div class="table-wrap" style="border:0"><table class="table"><caption class="sr-only">${t('byService')}</caption><thead><tr><th>${t('service')}</th><th>${t('bookingsWord')}</th><th>${t('netSales')}</th><th>${t('vatCollected')}</th><th>${t('cancellations')}</th><th>${t('avgTicket')}</th></tr></thead><tbody>
      ${bySvc.map(r => `<tr><td><span class="role-dot" style="background:${SVC_COLORS[r.s]}"></span> ${t('svc_' + r.s)}</td><td>${r.n}</td><td class="bold">${omr(r.rev)}</td><td>${omr(r.tax)}</td><td>${r.cancelled}</td><td>${omr(r.n - r.cancelled ? r.rev / (r.n - r.cancelled) : 0)}</td></tr>`).join('') || `<tr><td colspan="6" class="center muted">${t('noData')}</td></tr>`}
      ${bySvc.length ? `<tr style="font-weight:800"><td>${t('total')}</td><td>${tot.n}</td><td>${omr(tot.rev)}</td><td>${omr(tot.tax)}</td><td>${tot.cancelled}</td><td>${omr(tot.n - tot.cancelled ? tot.rev / (tot.n - tot.cancelled) : 0)}</td></tr>` : ''}</tbody></table></div></section>`);
  const f = $('#rp-f'); f.addEventListener('change', () => { const d = formData(f); if (d.from && d.to && d.from <= d.to) { Object.assign(ui, d); rerender(); } else toast(t('err_range'), 'error'); });
  pageActions = {
    range: (el) => { ui.to = todayISO(); ui.from = addDays(ui.to, -(+el.dataset.n) + 1); rerender(); },
    export: () => { if (!guardView('reports', 'export')) return; downloadCSV(`report-${ui.from}_${ui.to}.csv`, [['service', 'bookings', 'net_sales_omr', 'vat_omr', 'cancellations'], ...bySvc.map(r => [r.s, r.n, r.rev, r.tax, r.cancelled]), ['TOTAL', tot.n, tot.rev, tot.tax, tot.cancelled]]); logA('reports', 'export', 'reports', `Exported report ${ui.from} → ${ui.to}`); }
  };
}

/* =====================================================================
   17) SETTINGS — currencies, VAT, gateway, API keys (masked), services
   ===================================================================== */
function pageSettings() {
  const s = store.settings; const canS = can('settings', 'view'), ed = can('settings', 'edit');
  const kView = can('api_keys', 'view'), kReveal = can('api_keys', 'view_api_keys'), kEdit = can('api_keys', 'edit');
  const ro = ed ? '' : 'disabled';
  view(`<div class="page-top"><div><h1>${t('m_settings')}</h1><p>${t('settingsSub')}</p></div>${canS && !ed ? `<span class="badge badge-warning">${icon('lock')} ${t('readOnly')}</span>` : ''}</div>
    ${canS ? `<form id="st-form" novalidate class="stack">
      <section class="card card-body"><h2 style="font-size:1.05rem">${icon('globe')} ${t('currenciesRates')}</h2><p class="small muted">${t('ratesHint')}</p><div class="grid g4">${CURRENCIES.map(c => field({ name: 'rate_' + c, label: `1 OMR = ? ${c}`, type: 'number', value: s.currencies[c], attrs: `step="0.0001" min="0.0001" ${c === 'OMR' ? 'readonly' : ro}` })).join('')}</div>
        <div class="mt-1" style="max-width:260px">${field({ name: 'defaultCurrency', label: t('defaultCurrency'), type: 'select', options: CURRENCIES.map(c => [c, c]), value: s.defaultCurrency, attrs: ro })}</div></section>
      <section class="card card-body"><h2 style="font-size:1.05rem">${icon('tag')} ${t('vatPerService')}</h2><div class="grid g4">${SERVICES.map(x => field({ name: 'vat_' + x, label: t('svc_' + x) + ' %', type: 'number', value: s.vat[x], attrs: `min="0" max="30" step="0.5" ${ro}` })).join('')}</div></section>
      <section class="card card-body"><h2 style="font-size:1.05rem">${icon('card')} ${t('activeGateway')}</h2><div class="row">${['stripe', 'paytabs', 'myfatoorah'].map(g => `<label class="check" style="border:1.5px solid var(--border);border-radius:12px;padding:10px 14px"><input type="radio" name="gateway" value="${g}" ${s.gateway === g ? 'checked' : ''} ${ro}> ${{ stripe: 'Stripe', paytabs: 'PayTabs', myfatoorah: 'MyFatoorah' }[g]}</label>`).join('')}</div></section>
      <section class="card card-body"><h2 style="font-size:1.05rem">${icon('gear')} ${t('servicesToggle')}</h2><div class="grid g4">${SERVICES.map(x => `<label class="switch"><input type="checkbox" name="svc_${x}" value="1" ${s.services[x] ? 'checked' : ''} ${ro}> ${t('svc_' + x)}</label>`).join('')}</div></section>
      <div>${gbtn({ m: 'settings', a: 'edit', label: t('saveChanges'), ic: 'check', act: 'save', cls: 'btn-primary' })}</div></form>` : alertBox('info', t('needPerm', { p: permLabel('settings', 'view') }))}
    <section class="card card-body mt-2"><div class="row-between"><h2 class="mb-0" style="font-size:1.05rem">${icon('lock')} ${t('m_api_keys')}</h2>${kView ? (kReveal ? `<span class="badge badge-success">${t('canReveal')}</span>` : `<span class="badge badge-warning">${icon('lock')} ${t('maskedOnly')}</span>`) : ''}</div>
      ${kView ? `<p class="small muted">${t('keysHint')}</p><div class="table-wrap"><table class="table"><thead><tr><th>${t('integration')}</th><th>${t('value')}</th><th></th></tr></thead><tbody>
        ${Object.keys(s.keys).map(k => `<tr><td><strong>${esc(s.keys[k].label)}</strong><br><span class="xsmall muted mono">${k}</span></td><td id="kv-${k}">${maskKey(s.keys[k].value, false)}</td><td style="white-space:nowrap">${gbtn({ m: 'api_keys', a: 'view_api_keys', label: t('reveal'), ic: 'eye', act: 'reveal', data: `data-k="${k}"` })} ${gbtn({ m: 'api_keys', a: 'edit', label: t('rotate'), ic: 'refresh', act: 'rotate', data: `data-k="${k}"` })}</td></tr>`).join('')}</tbody></table></div>` : alertBox('warning', t('needPerm', { p: permLabel('api_keys', 'view') }))}</section>`);
  pageActions = {
    save: () => {
      if (!guard('settings', 'edit')) return; const f = $('#st-form'); const d = formData(f); const er = {};
      CURRENCIES.forEach(c => { if (!(+d['rate_' + c] > 0)) er['rate_' + c] = t('err_amount'); }); SERVICES.forEach(x => { const v = +d['vat_' + x]; if (!(v >= 0 && v <= 30)) er['vat_' + x] = t('err_amount'); });
      if (!showErrors(f, er)) return;
      const before = clone({ currencies: s.currencies, vat: s.vat, gateway: s.gateway, services: s.services, defaultCurrency: s.defaultCurrency });

      logA('settings', 'edit', 'settings', 'Updated settings (rates, VAT, gateway, services)', before, { currencies: s.currencies, vat: s.vat, gateway: s.gateway, services: s.services, defaultCurrency: s.defaultCurrency });

      s.keys[k].value = nv; logA('api_keys', 'edit', k, `Rotated API key “${s.keys[k].label}”`, { value: '••••' }, { value: '••••' + nv.slice(-4) }); toast(t('keyRotated'), 'success'); rerender();
    }
  };
}

/* =====================================================================
   18) ACTIVITY LOG — who, what, before/after, when
   ===================================================================== */
function pageActivity() {
  const ui = state.ui.al || (state.ui.al = { actor: '', module: '', from: '', to: '', q: '', page: 1 });
  const mods = [...new Set(store.activity.map(a => a.module))].sort();
  view(`<div class="page-top"><div><h1>${t('m_activity_log')}</h1><p>${t('activitySub')}</p></div><div class="toolbar">${gbtn({ m: 'activity_log', a: 'export', label: t('exportCsv'), ic: 'download', act: 'export' })}</div></div>
    <section class="card"><form class="filters-row" id="al-f" role="search"><div class="field" style="grid-column:span 2"><label for="al-q">${t('search')}</label><input id="al-q" name="q" type="search" class="input" value="${esc(ui.q)}" placeholder="${t('activityPh')}"></div>
      <div class="field"><label for="al-a">${t('user')}</label><select id="al-a" name="actor" class="select"><option value="">${t('all')}</option>${store.users.map(u => `<option value="${u.id}" ${ui.actor === u.id ? 'selected' : ''}>${esc(u.name)}</option>`).join('')}</select></div>
      <div class="field"><label for="al-m">${t('module')}</label><select id="al-m" name="module" class="select"><option value="">${t('all')}</option>${mods.map(m => `<option value="${m}" ${ui.module === m ? 'selected' : ''}>${T['m_' + m] ? t('m_' + m) : m}</option>`).join('')}</select></div>
      <div class="field"><label for="al-from">${t('fromDate')}</label><input id="al-from" name="from" type="date" class="input" value="${ui.from}"></div><div class="field"><label for="al-to">${t('toDate')}</label><input id="al-to" name="to" type="date" class="input" value="${ui.to}"></div></form><div id="al-table"></div></section>`);
  const list = () => store.activity.filter(a => (!ui.actor || a.actorId === ui.actor || a.impersonatorId === ui.actor) && (!ui.module || a.module === ui.module) && (!ui.from || isoLocal(new Date(a.at)) >= ui.from) && (!ui.to || isoLocal(new Date(a.at)) <= ui.to) && (!ui.q || (a.summary + ' ' + a.actorName + ' ' + a.target + ' ' + a.action).toLowerCase().includes(ui.q.toLowerCase())));
  const draw = () => {
    const all = list(); const pages = Math.max(1, Math.ceil(all.length / CONFIG.PAGE_SIZE)); ui.page = clamp(ui.page, 1, pages);
    $('#al-table').innerHTML = `<div class="table-wrap" style="border:0;border-top:1px solid var(--border);border-radius:0"><table class="table"><caption class="sr-only">${t('m_activity_log')}</caption><thead><tr><th>${t('when')}</th><th>${t('who')}</th><th>${t('module')}</th><th>${t('action')}</th><th>${t('summary')}</th><th></th></tr></thead><tbody>
      ${all.slice((ui.page - 1) * CONFIG.PAGE_SIZE, ui.page * CONFIG.PAGE_SIZE).map(a => `<tr><td class="small" style="white-space:nowrap">${fmtDateTime(a.at)}</td><td>${esc(a.actorName)}${a.impersonatorId ? `<br><span class="xsmall badge badge-warning">${t('viaImp', { n: esc(userName(a.impersonatorId)) })}</span>` : ''}</td><td>${T['m_' + a.module] ? t('m_' + a.module) : esc(a.module)}</td><td><span class="badge">${esc(a.action)}</span></td><td class="small">${esc(a.summary)}</td><td>${a.before || a.after ? `<button type="button" class="btn btn-ghost btn-sm" data-action="diff" data-id="${a.id}">${t('beforeAfter')}</button>` : ''}</td></tr>`).join('') || `<tr><td colspan="6" class="center muted">${t('noData')}</td></tr>`}
      </tbody></table></div>${pager(all.length, ui.page, 'page')}`;
  };
  draw();
  const f = $('#al-f'); f.addEventListener('input', () => { Object.assign(ui, formData(f)); ui.page = 1; draw(); }); f.addEventListener('submit', (ev) => ev.preventDefault());
  pageActions = {
    page: (el) => { ui.page = +el.dataset.page; draw(); },
    diff: (el) => { const a = store.activity.find(x => x.id === el.dataset.id); openModal({ title: esc(a.summary), size: 'lg', body: `<div class="small muted mb-1">${esc(a.actorName)} · ${fmtDateTime(a.at)} · ${esc(a.module)}/${esc(a.action)} · <span class="mono">${esc(a.target)}</span></div><div class="grid g2"><div><div class="bold small mb-1">${t('before')}</div><pre class="json">${esc(JSON.stringify(a.before, null, 2))}</pre></div><div><div class="bold small mb-1">${t('after')}</div><pre class="json">${esc(JSON.stringify(a.after, null, 2))}</pre></div></div>`, actions: [{ label: t('close'), cls: 'btn-primary' }] }); },
    export: () => { if (!guardView('activity_log', 'export')) return; const l = list(); downloadCSV(`activity-${todayISO()}.csv`, [['at', 'actor', 'impersonator', 'module', 'action', 'target', 'summary', 'before', 'after'], ...l.map(a => [a.at, a.actorName, a.impersonatorId ? userName(a.impersonatorId) : '', a.module, a.action, a.target, a.summary, JSON.stringify(a.before), JSON.stringify(a.after)])]); }
  };
}

const roleNames = (ids) => ids.map(id => (roleById(id) ? L(roleById(id).name) : id)).join(', ');
function pageUsers() {
  const ui = state.ui.us || (state.ui.us = { q: '', role: '', status: '' });

/** Readable sentences describing a role (used by summary page, builder side panel and "My permissions"). */
function roleSentences(perms, scope) {
  const yes = [], no = [];
  MODULES.forEach(m => {
    const acts = (perms[m] || []).filter(a => APPLICABLE[m].includes(a));
    if (!acts.length) { no.push(t('cannotAccess', { m: t('m_' + m) })); return; }
    const words = acts.map(a => t('aw_' + a));
    let s = t('canDo', { a: listJoin(words), m: t('m_' + m) });
    if (m === 'bookings' && scope && scope.services !== 'all') s += ' ' + t('onlySvc', { s: (scope.services || []).map(x => t('svc_' + x)).join('، ') });
    if ((m === 'leads' || m === 'visa_leads') && scope && scope.leads === 'assigned') s += ' ' + t('onlyAssigned');
    yes.push(s);
    const missing = APPLICABLE[m].filter(a => !acts.includes(a)).map(a => t('aw_' + a));
    if (missing.length) no.push(t('cannotDo', { a: listJoin(missing), m: t('m_' + m) }));
  });
  return { yes, no };
}
const listJoin = (arr) => arr.length <= 1 ? arr.join('') : arr.slice(0, -1).join('، ') + ' ' + t('and') + (state.lang === 'ar' ? '' : ' ') + arr[arr.length - 1];

    <div><h3 style="font-size:.95rem;color:var(--danger)">${icon('x')} ${t('cannotSection')}</h3><ul class="list-check no sentences small">${s.no.map(x => `<li>${icon('x')}<span>${x}</span></li>`).join('')}</ul></div></div>`;
}
