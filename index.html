    <form id="rb-form" novalidate class="stack">
      <section class="card card-body"><h2 style="font-size:1.05rem">${t('identity')}</h2><div class="form-grid">
        ${field({ name: 'name_en', label: t('roleName') + ' (EN)', required: true, value: dr.name.en, attrs: 'dir="ltr"' })}${field({ name: 'name_ar', label: t('roleName') + ' (AR)', required: true, value: dr.name.ar, attrs: 'dir="rtl"' })}
        ${field({ name: 'desc_en', label: t('desc') + ' (EN)', type: 'textarea', value: dr.desc.en, attrs: 'dir="ltr" rows="2"' })}${field({ name: 'desc_ar', label: t('desc') + ' (AR)', type: 'textarea', value: dr.desc.ar, attrs: 'dir="rtl" rows="2"' })}</div>
        <fieldset class="mt-1" style="border:0;padding:0"><legend class="label small bold">${t('color')}</legend><div class="row">${ROLE_COLORS.map(c => `<label style="cursor:pointer"><input type="radio" name="color" value="${c}" ${dr.color === c ? 'checked' : ''} class="sr-only"><span class="role-dot" style="background:${c};width:26px;height:26px;outline:${dr.color === c ? '3px solid var(--gold)' : 'none'};outline-offset:2px" aria-label="${c}"></span></label>`).join('')}</div></fieldset></section>
      <section class="card card-body"><h2 style="font-size:1.05rem">${t('dataScope')}</h2><p class="small muted">${t('dataScopeHint')}</p><div class="grid g2">
        <fieldset style="border:0;padding:0"><legend class="label small bold">${t('bookingsScope')}</legend>
          <label class="check"><input type="radio" name="svcmode" value="all" ${dr.scope.services === 'all' ? 'checked' : ''}> ${t('scopeAllSvc')}</label>
          <label class="check"><input type="radio" name="svcmode" value="some" ${dr.scope.services !== 'all' ? 'checked' : ''}> ${t('specificSvc')}</label>
          <div class="row mt-1" id="svc-boxes" style="padding-inline-start:28px">${SERVICES.map(s => `<label class="check small"><input type="checkbox" name="svc" value="${s}" ${dr.scope.services !== 'all' && dr.scope.services.includes(s) ? 'checked' : ''} ${dr.scope.services === 'all' ? 'disabled' : ''}> ${t('svc_' + s)}</label>`).join('')}</div></fieldset>
        <fieldset style="border:0;padding:0"><legend class="label small bold">${t('leadsScope')}</legend>
          <label class="check"><input type="radio" name="leadmode" value="all" ${dr.scope.leads === 'all' ? 'checked' : ''}> ${t('scopeAllLeads')}</label>
          <label class="check"><input type="radio" name="leadmode" value="assigned" ${dr.scope.leads === 'assigned' ? 'checked' : ''}> ${t('scopeAssignedLeads')}</label></fieldset></div></section>
      <section class="card card-body"><div class="row-between mb-1"><h2 class="mb-0" style="font-size:1.05rem">${t('permMatrix')}</h2><span class="badge badge-teal" id="perm-count"></span></div><p class="small muted">${t('matrixHint')}</p>${matrixHtml(dr.perms, true)}</section>
      <section class="card card-body"><h2 style="font-size:1.05rem">${t('whatCanDo')} <span class="xsmall muted">(${t('live')})</span></h2><div id="live-sum"></div></section>
    </form>`);
  const f = $('#rb-form');
  const readForm = () => {
    const d = formData(f);
    dr.name = { en: (d.name_en || '').trim(), ar: (d.name_ar || '').trim() }; dr.desc = { en: d.desc_en || '', ar: d.desc_ar || '' }; dr.color = d.color || dr.color;
    dr.scope = { services: d.svcmode === 'all' ? 'all' : $$('[name=svc]:checked', f).map(x => x.value), leads: d.leadmode === 'assigned' ? 'assigned' : 'all' };
    const perms = {}; $$('#matrix [data-m]:checked').forEach(cb => { (perms[cb.dataset.m] = perms[cb.dataset.m] || []).push(cb.dataset.a); }); dr.perms = perms;
  };
  const syncHeaders = () => {
    MODULES.forEach(m => { const boxes = $$(`#matrix [data-m="${m}"]`); const rb = $(`[data-row="${m}"]`); const n = boxes.filter(b => b.checked).length; rb.checked = n === boxes.length; rb.indeterminate = n > 0 && n < boxes.length; });
    ACTIONS.forEach(a => { const boxes = $$(`#matrix [data-a="${a}"]`); const cb = $(`[data-col="${a}"]`); const n = boxes.filter(b => b.checked).length; cb.checked = boxes.length > 0 && n === boxes.length; cb.indeterminate = n > 0 && n < boxes.length; });
    const all = $$('#matrix [data-m]'); const n = all.filter(b => b.checked).length; const aa = $('#all-all'); aa.checked = n === all.length; aa.indeterminate = n > 0 && n < all.length;
    $('#perm-count').textContent = `${n} / ${all.length}`;
    readForm(); $('#live-sum').innerHTML = sentencesHtml(dr.perms, dr.scope);
  };
  /** Dependency rule: any action implies `view`; removing `view` clears the row. */
  const enforceView = (m, changedAction, checked) => {
    const viewBox = $(`#matrix [data-m="${m}"][data-a="view"]`); if (!viewBox) return;
    if (changedAction !== 'view' && checked) viewBox.checked = true;
    if (changedAction === 'view' && !checked) $$(`#matrix [data-m="${m}"]`).forEach(b => { b.checked = false; });
  };
  $('#matrix').addEventListener('change', (e) => {
    const c = e.target;
    if (c.dataset.m) enforceView(c.dataset.m, c.dataset.a, c.checked);
    if (c.dataset.row) $$(`#matrix [data-m="${c.dataset.row}"]`).forEach(b => { b.checked = c.checked; });
    if (c.dataset.col) $$(`#matrix [data-a="${c.dataset.col}"]`).forEach(b => { b.checked = c.checked; enforceView(b.dataset.m, c.dataset.col, c.checked); });
    if (c.id === 'all-all') $$('#matrix [data-m]').forEach(b => { b.checked = c.checked; });
    syncHeaders();
  });
  f.addEventListener('change', (e) => {
    if (e.target.name === 'svcmode') $$('[name=svc]', f).forEach(b => { b.disabled = e.target.value === 'all'; });
    if (e.target.name === 'color') { $$('[name=color]', f).forEach(r => { r.nextElementSibling.style.outline = r.checked ? '3px solid var(--gold)' : 'none'; }); }
    syncHeaders();
  });
  f.addEventListener('input', () => readForm());
  syncHeaders();
  pageActions = {
    preview: () => { readForm(); startPreview({ ...dr, name: { ar: dr.name.ar || 'دور جديد', en: dr.name.en || 'New role' } }, location.hash); },
    save: () => {
      readForm();
      if (!guard('roles', isNew ? 'create' : 'edit')) return;
      const er = {};
      if (dr.name.en.length < 2) er.name_en = t('err_required'); if (dr.name.ar.length < 2) er.name_ar = t('err_required');
      if (store.roles.some(r => r.id !== dr.id && (r.name.en.toLowerCase() === dr.name.en.toLowerCase()))) er.name_en = t('err_exists');
      if (!showErrors(f, er)) return;
      if (dr.scope.services !== 'all' && !dr.scope.services.length) { toast(t('err_scopeSvc'), 'error'); return; }
      if (!Object.keys(dr.perms).length) { toast(t('err_noPerms'), 'error'); return; }
      const data = { name: dr.name, desc: dr.desc, color: dr.color, perms: dr.perms, scope: dr.scope };
      if (isNew) { const r = { id: uid('R-'), system: false, ...clone(data) }; store.roles.push(r); logA('roles', 'create', r.id, `Created role “${r.name.en}” (${permCount(r)} permissions)`, null, r); state.roleDraft = null; toast(t('roleSaved'), 'success'); go('#/roles/' + r.id); }
      else { const before = clone(orig); Object.assign(orig, clone(data)); logA('roles', 'edit', orig.id, `Updated role “${orig.name.en}” (${permCount(before)} → ${permCount(orig)} permissions)`, before, orig); state.roleDraft = null; toast(t('roleSaved'), 'success'); go('#/roles/' + orig.id); }
    }
  };
}
/** "My permissions" — what the current actor can do (always accessible). */
function pageMe() {
  const a = actor(); const e = effective();
  const perms = Object.fromEntries(Object.entries(e.perms).map(([m, s]) => [m, [...s]]));
  view(`<div class="page-top"><div><h1>${t('myPermissions')}</h1><p>${esc(a.name)} — ${a.roles.map(r => esc(L(r.name))).join(' + ') || t('noRoles')}</p></div></div>
    ${a.user && a.user.status !== 'active' ? alertBox('danger', t('userDisabledNote')) : ''}
    <section class="card card-body mb-2"><p class="small muted">${t('scopeLabel')}: ${e.services === 'all' ? t('scopeAllSvc') : t('scopeSomeSvc', { s: e.services.map(s => t('svc_' + s)).join('، ') || '—' })} · ${e.leads === 'all' ? t('scopeAllLeads') : t('scopeAssignedLeads')}</p>${sentencesHtml(perms, { services: e.services, leads: e.leads })}</section>
    <section class="card card-body"><h2 style="font-size:1.05rem">${t('permMatrix')}</h2>${matrixHtml(perms, false)}</section>`);
}

/* =====================================================================
   21) ROUTES + BOOT
   ===================================================================== */
route('/dashboard', pageDashboard, ['dashboard', 'view'], 'm_dashboard');
route('/bookings', pageBookings, ['bookings', 'view'], 'm_bookings');
route('/bookings/:ref', pageBookingDetail, ['bookings', 'view'], 'm_bookings');
route('/leads', pageLeads('leads'), ['leads', 'view'], 'm_leads');
route('/visa-leads', pageLeads('visa_leads'), ['visa_leads', 'view'], 'm_visa_leads');
route('/customers', pageCustomers, ['customers', 'view'], 'm_customers');
route('/customers/:id', pageCustomerProfile, ['customers', 'view'], 'm_customers');
route('/wallet', pageWallet, ['wallet', 'view'], 'm_wallet');
route('/cms', pageCMS, ['cms', 'view'], 'm_cms');
route('/packages', pagePackages, ['packages', 'view'], 'm_packages');
route('/reports', pageReports, ['reports', 'view'], 'm_reports');
route('/users', pageUsers, ['users', 'view'], 'm_users');
route('/roles', pageRoles, ['roles', 'view'], 'm_roles');
route('/roles/new', pageRoleBuilder, ['roles', 'create'], 'newRole');
route('/roles/:id/edit', pageRoleBuilder, ['roles', 'edit'], 'editRole');
route('/roles/:id', pageRoleSummary, ['roles', 'view'], 'whatCanDo');
route('/settings', pageSettings, () => can('settings', 'view') || can('api_keys', 'view'), 'm_settings');
route('/activity', pageActivity, ['activity_log', 'view'], 'm_activity_log');
route('/me', pageMe, null, 'myPermissions');

function init() {
  loadStore(); loadSession();
  if (session.userId && !userById(session.userId)) { session.userId = null; session.actingUserId = null; }
  if (session.actingUserId && !userById(session.actingUserId)) session.actingUserId = null;
  applyLang(); applyTheme();
  window.addEventListener('hashchange', () => { window.scrollTo(0, 0); router(); });
  $('#skip-link').addEventListener('click', () => $('#app').focus());
  router();
}
init();
</script>
